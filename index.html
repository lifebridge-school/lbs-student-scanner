
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LBS Student Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 18px;
      color: #1e293b;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }

    h2 {
      text-align: center;
      color: #15803d;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 9px;
      border-radius: 9px;
      font-size: 16px;
      box-sizing: border-box;
    }

    select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: none;
      color: white;
      background: #15803d;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .stop {
      background: #dc2626;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #f1f5f9;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }
  </style>
</head>

<body>

<div class="container">

  <h2> LBS Student Scanner </h2>

  <p style="text-align:center">
    Scan a student ID card to identify the student.
  </p>

  <label>Scanning Location</label>
  <select id="location">
    <option value="Campus 1A">Campus 1A</option>
    <option value="Campus 1B">Campus 1B</option>
    <option value="Campus 2">Campus 2</option>
  </select>

  <label>Attendance Action</label>
  <select id="event">
    <option value="IN">CHECK IN - Arrival</option>
    <option value="OUT">CHECK OUT - Departure</option>
  </select>

  <button id="startButton" onclick="startScanner()">
    START SCANNING
  </button>

  <button id="stopButton"
          class="stop"
          onclick="stopScanner()"
          style="display:none">
    STOP SCANNING
  </button>

  <div id="reader"></div>

  <div id="result">
    Ready to scan a student ID.
  </div>

  <button id="nextButton"
          onclick="startScanner()"
          style="display:none">
    SCAN NEXT STUDENT
  </button>

</div>

<script>

  let scanner = null;
  let scanning = false;
  let processing = false;

  // Temporary sample student database
  const sampleStudents = {
    "TEST001": "Sample Student 1",
    "TEST002": "Sample Student 2",
    "TEST003": "Sample Student 3",
    "TEST004": "Sample Student 4",
    "TEST005": "Sample Student 5"
  };

  function showResult(message, type) {
    const box = document.getElementById("result");
    box.className = type || "";
    box.textContent = message;
  }

  async function startScanner() {

    if (scanning || processing) return;

    if (typeof Html5Qrcode === "undefined") {
      showResult(
        "Scanner library failed to load. Check your internet connection.",
        "error"
      );
      return;
    }

    document.getElementById("startButton").disabled = true;
    document.getElementById("nextButton").style.display = "none";

    try {

      if (!scanner) {
        scanner = new Html5Qrcode("reader");
      }

      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error("No camera was found.");
      }

      const camera = cameras.find(c =>
        /back|rear|environment/i.test(c.label)
      ) || cameras[0];

      await scanner.start(
        camera.id,
        {
          fps: 10,
          qrbox: { width: 230, height: 230 }
        },
        onScanSuccess
      );

      scanning = true;

      document.getElementById("stopButton").style.display = "block";

      showResult(
        "Camera is ready!\n\nPlease scan a student QR code."
      );

    } catch (error) {

      showResult(
        "CAMERA ERROR\n\n" + error.name + "\n" + error.message,
        "error"
      );

      document.getElementById("startButton").disabled = false;
    }
  }

  async function onScanSuccess(decodedText) {

    if (processing) return;

    processing = true;

    try {
      await scanner.stop();
    } catch (error) {}

    scanning = false;

    const studentID = decodedText.trim();
    const studentName = sampleStudents[studentID];

    const location = document.getElementById("location").value;
    const event = document.getElementById("event").value;

    if (studentName) {

      showResult(
        "SUCCESS! STUDENT RECOGNIZED!\n\n" +
        "Student: " + studentName + "\n" +
        "Student ID: " + studentID + "\n" +
        "Action: " + event + "\n" +
        "Location: " + location + "\n" +
        "Time: " + new Date().toLocaleTimeString() +
        "\n\nQR scanning is working!",
        "success"
      );

    } else {

      showResult(
        "UNKNOWN STUDENT\n\n" +
        "Scanned code: " + studentID +
        "\n\nThis ID is not in our sample database.",
        "error"
      );
    }

    document.getElementById("stopButton").style.display = "none";
    document.getElementById("startButton").disabled = false;
    document.getElementById("nextButton").style.display = "block";

    processing = false;
  }

  async function stopScanner() {

    if (scanner && scanning) {
      try {
        await scanner.stop();
      } catch (error) {}

      scanning = false;
    }

    document.getElementById("stopButton").style.display = "none";
    document.getElementById("startButton").disabled = false;

    showResult("Scanning stopped. You can start again.");
  }

</script>

</body>
</html>
